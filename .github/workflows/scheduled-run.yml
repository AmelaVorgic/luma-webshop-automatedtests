name: Daily E2E Tests Run

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  functional-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run authentication setup
        run: npx playwright test --project=setup
      - name: Run functional tests
        run: npm run test:functional
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 30

  accessibility-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run authentication setup
        run: npx playwright test --project=setup
      - name: Run accessibility tests
        run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: accessibility-test-report
          path: playwright-report/
          retention-days: 30

  send_failure_email:
    runs-on: ubuntu-latest
    needs: [functional-tests, accessibility-tests]
    if: failure()
    steps:
      - name: Download functional test artifacts
        uses: actions/download-artifact@v4
        with:
          name: functional-test-report
      - name: Download accessibility test artifacts
        uses: actions/download-artifact@v4
        with:
          name: accessibility-test-report
      - name: Send email with failure artifacts
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com 
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Playwright Tests Failed"
          body: "Playwright tests failed in branch ${{ github.ref_name }}. Check failure logs in attachment."
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "GitHub Actions ${{ secrets.EMAIL_USERNAME }}"
          attachments: |
            functional-test-report/test-results/test-report.html
            accessibility-test-report/test-results/test-report.html